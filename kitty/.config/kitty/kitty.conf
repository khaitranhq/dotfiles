font_family      FiraCode Nerd Font
fallback_family Noto Color Emoji
bold_font        auto
allow_color_fonts yes
italic_font      auto
bold_italic_font auto
font_size  11

#clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_control write-primary write-clipboard read-clipboard read-primary # no-append

map shift+enter send_text all \x1b[13;2u

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map alt+- launch --location=hsplit --cwd root
map alt+shift+\ launch --location=vsplit --cwd root

# Move the active window in the indicated direction
map alt+up neighboring_window up
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+down neighboring_window down

map alt+shift+, resize_window narrower 3
map alt+shift+. resize_window wider 3
map alt+shift+= resize_window taller 3
map alt+shift+- resize_window shorter 3

map alt+shift+up move_window up
map alt+shift+left move_window left
map alt+shift+right move_window right
map alt+shift+down move_window down

#map ctrl+shift+t launch --type tab --cwd root --location neighbor

map alt+shift+f toggle_layout stack

enabled_layouts splits,stack

remember_window_size  yes

hide_window_decorations yes

# window_border_width 5pt
# active_border_color #00ff00
window_padding_width 0.0

# fg0 - primary fg
foreground           #ebdbb2
# bg0 - primary bg
background           #1c1c1c
# fg2 - muted fg
title_fg             #928374

# folded - dim bg
title_bg             #121212
margin_bg            #121212

# fg2
margin_fg            #928374
# folded
filler_bg            #121212

# diff_delete
removed_bg           #2f1f1a
highlight_removed_bg #2f1f1a
removed_margin_bg    #2f1f1a

# diff_add
added_bg             #273923
highlight_added_bg   #273923
added_margin_bg      #273923

# folded
hunk_margin_bg       #121212
hunk_bg              #121212

# search - search highlight bg
search_bg            #3a4a3a
# fg0 - light text on search bg
search_fg            #ebdbb2
# visual - selection bg
select_bg            #2a405a
# fg0 - primary fg
select_fg            #ebdbb2

allow_remote_control yes
listen_on unix:/tmp/kitty

bell_on_tab             yes
tab_bar_edge            top
tab_title_template       {index}: {title}
active_tab_foreground   #1c1c1c
active_tab_background   #fabd2f
active_tab_font_style   bold
inactive_tab_foreground #a89984
inactive_tab_background #3c3836
inactive_tab_font_style normal
tab_bar_style custom
#tab_powerline_style slanted
