# Eza theme configuration (retrobox dark)
# Reference: retrobox.vim (bundled with Neovim)

colourful: true

# Retrobox Dark Palette
# Background: #1c1c1c
# Foreground: #ebdbb2
# Black: #121212
# Red: #fb5944
# Green: #b8bb26
# Yellow: #fabd2f
# Blue: #83a598
# Magenta: #d3869b
# Cyan: #8ec07c
# White: #ebdbb2
# Gray: #928374
# Bright Black: #504945
# Bright Red: #fb5944
# Bright Green: #b8bb26
# Bright Yellow: #fabd2f
# Bright Blue: #83a598
# Bright Magenta: #d3869b
# Bright Cyan: #8ec07c
# Bright White: #ebdbb2

filekinds:
  normal: { foreground: "#ebdbb2" }
  directory: { foreground: "#b8bb26" }
  symlink: { foreground: "#928374" }
  pipe: { foreground: "#504945" }
  block_device: { foreground: "#fb5944" }
  char_device: { foreground: "#d3869b" }
  socket: { foreground: "#121212" }
  special: { foreground: "#d3869b" }
  executable: { foreground: "#b8bb26" }
  mount_point: { foreground: "#504945" }

perms:
  user_read: { foreground: "#928374" }
  user_write: { foreground: "#504945" }
  user_execute_file: { foreground: "#b8bb26" }
  user_execute_other: { foreground: "#b8bb26" }
  group_read: { foreground: "#928374" }
  group_write: { foreground: "#504945" }
  group_execute: { foreground: "#b8bb26" }
  other_read: { foreground: "#928374" }
  other_write: { foreground: "#504945" }
  other_execute: { foreground: "#b8bb26" }
  special_user_file: { foreground: "#d3869b" }
  special_other: { foreground: "#504945" }
  attribute: { foreground: "#928374" }

size:
  major: { foreground: "#928374" }
  minor: { foreground: "#d3869b" }
  number_byte: { foreground: "#928374" }
  number_kilo: { foreground: "#928374" }
  number_mega: { foreground: "#8ec07c" }
  number_giga: { foreground: "#d3869b" }
  number_huge: { foreground: "#d3869b" }
  unit_byte: { foreground: "#928374" }
  unit_kilo: { foreground: "#8ec07c" }
  unit_mega: { foreground: "#d3869b" }
  unit_giga: { foreground: "#d3869b" }
  unit_huge: { foreground: "#d3869b" }

users:
  user_you: { foreground: "#d3869b" }
  user_root: { foreground: "#fb5944" }
  user_other: { foreground: "#d3869b" }
  group_yours: { foreground: "#928374" }
  group_other: { foreground: "#504945" }
  group_root: { foreground: "#fb5944" }

links:
  normal: { foreground: "#83a598" }
  multi_link_file: { foreground: "#8ec07c" }

git:
  new: { foreground: "#b8bb26" }
  modified: { foreground: "#d3869b" }
  deleted: { foreground: "#fb5944" }
  renamed: { foreground: "#8ec07c" }
  typechange: { foreground: "#d3869b" }
  ignored: { foreground: "#504945" }
  conflicted: { foreground: "#fb5944" }

git_repo:
  branch_main: { foreground: "#928374" }
  branch_other: { foreground: "#d3869b" }
  git_clean: { foreground: "#b8bb26" }
  git_dirty: { foreground: "#fb5944" }

security_context:
  colon: { foreground: "#928374" }
  user: { foreground: "#d3869b" }
  role: { foreground: "#d3869b" }
  typ: { foreground: "#504945" }
  range: { foreground: "#d3869b" }

file_type:
  image: { foreground: "#d3869b" }
  video: { foreground: "#fb5944" }
  music: { foreground: "#d3869b" }
  lossless: { foreground: "#504945" }
  crypto: { foreground: "#121212" }
  document: { foreground: "#928374" }
  compressed: { foreground: "#d3869b" }
  temp: { foreground: "#fb5944" }
  compiled: { foreground: "#8ec07c" }
  build: { foreground: "#504945" }
  source: { foreground: "#b8bb26" }

punctuation: { foreground: "#928374" }
date: { foreground: "#8ec07c" }
inode: { foreground: "#928374" }
blocks: { foreground: "#928374" }
header: { foreground: "#928374" }
octal: { foreground: "#d3869b" }
flags: { foreground: "#d3869b" }

symlink_path: { foreground: "#83a598" }
control_char: { foreground: "#8ec07c" }
broken_symlink: { foreground: "#fb5944" }
broken_path_overlay: { foreground: "#928374" }
