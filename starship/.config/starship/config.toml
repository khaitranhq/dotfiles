format = """
$fill\
$line_break\
$directory\
$cmd_duration\
$nodejs\
$git_branch\
$git_state\
$git_status\
$pulumi\
$line_break\
$character"""

right_format = """$time"""

add_newline = false
palette = "oxocarbon"

[fill]
symbol = "─"
style = "fg:grey0"

[directory]
style = "fg:orange"
read_only_style = "fg:orange"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = "took [$duration]($style) "
style = "fg:yellow"


[nodejs]
style = "fg:green"
symbol = " "
format = "[$symbol$version]($style) "

[git_branch]
style = "fg:green"
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "


[git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style)) '
conflicted = '⚠️${count} '
ahead = '⬆️${count} '
behind = '⬇️${count} '
diverged = '↕️${ahead_count}⇣${behind_count} '
up_to_date = ''
untracked = '❓${count} '
stashed = '📦${count} '
modified = '✏️${count} '
staged = '➕${count} '
renamed = '➡️${count} '
deleted = '❌${count} '

[character]
success_symbol = '[→](bold green)'
error_symbol = '[→](bold #ee5396)'

[time]
disabled = false
time_format = '%T'
utc_time_offset = '+7'

[pulumi]
format = '[🛥 $stack]($style) '

[palettes.oxocarbon]
# base00-base06 (blended from #161616 -> #ffffff)
base00 = "#161616"
base01 = "#2a2a2a"
base02 = "#404040"
base03 = "#5c5c5c"
base04 = "#d5d5d5"
base05 = "#f3f3f3"
base06 = "#ffffff"

# accent colors
cyan = "#08bdba"
teal = "#3ddbd9"
blue = "#78a9ff"
magenta = "#ee5396"
blue2 = "#33b1ff"
pink = "#ff7eb6"
green = "#42be65"
purple = "#be95ff"
cyan2 = "#82cfff"
blend = "#131313"

# semantic aliases (matching old everforest keys)
fg = "#d5d5d5"
red = "#ee5396"
orange = "#ff7eb6"
yellow = "#be95ff"
aqua = "#08bdba"
grey0 = "#404040"
grey1 = "#5c5c5c"
grey2 = "#d5d5d5"
statusline1 = "#42be65"
statusline2 = "#d5d5d5"
statusline3 = "#ee5396"
