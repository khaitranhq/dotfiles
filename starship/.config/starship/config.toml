format = """
$fill\
$line_break\
$directory\
$cmd_duration\
$nodejs\
$git_branch\
$git_state\
$git_status\
$pulumi\
$line_break\
$character"""

right_format = """$time"""

add_newline = false
palette = "retrobox"

[fill]
symbol = "─"
style = "fg:grey0"

[directory]
style = "fg:orange"
read_only_style = "fg:orange"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = "took [$duration]($style) "
style = "fg:yellow"


[nodejs]
style = "fg:green"
symbol = " "
format = "[$symbol$version]($style) "

[git_branch]
style = "fg:green"
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "


[git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style)) '
conflicted = '⚠️${count} '
ahead = '⬆️${count} '
behind = '⬇️${count} '
diverged = '↕️${ahead_count}⇣${behind_count} '
up_to_date = ''
untracked = '❓${count} '
stashed = '📦${count} '
modified = '✏️${count} '
staged = '➕${count} '
renamed = '➡️${count} '
deleted = '❌${count} '

[character]
success_symbol = '[→](bold green)'
error_symbol = '[→](bold #fb5944)'

[time]
disabled = false
time_format = '%T'
utc_time_offset = '+7'

[pulumi]
format = '[🛥 $stack]($style) '

[palettes.retrobox]
# retrobox dark (gruvbox-inspired)
bg0 = "#1c1c1c"
bg1 = "#303030"
bg2 = "#3c3836"
bg3 = "#504945"
fg0 = "#ebdbb2"
fg1 = "#a89984"
fg2 = "#928374"
fg3 = "#7c6f64"
white = "#fbf1c7"

# accent colors
red = "#fb5944"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
aqua = "#8ec07c"
orange = "#fe8019"

# semantic aliases (matching previous palette keys)
fg = "#ebdbb2"
cyan = "#8ec07c"
teal = "#8ec07c"
magenta = "#d3869b"
blue2 = "#83a598"
pink = "#d3869b"
cyan2 = "#8ec07c"
blend = "#121212"
grey0 = "#504945"
grey1 = "#928374"
grey2 = "#a89984"
statusline1 = "#b8bb26"
statusline2 = "#ebdbb2"
statusline3 = "#fb5944"
