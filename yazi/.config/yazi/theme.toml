# Reference: retrobox.vim (gruvbox-inspired, bundled with Neovim)

[mgr]

cwd = { fg = "#ebdbb2", italic = true }

# Hovered
hovered = { bg = "#303030" }
preview_hovered = { bg = "#303030" }

# Find
find_keyword = { fg = "#1c1c1c", bg = "#fabd2f", bold = true }
find_position = { fg = "#8ec07c", bg = "#273923", bold = true }

# Marker
marker_copied = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut = { fg = "#fb5944", bg = "#fb5944" }
marker_marked = { fg = "#d3869b", bg = "#d3869b" }
marker_selected = { fg = "#83a598", bg = "#83a598" }

# Tab
tab_active = { fg = "#fbf1c7", bg = "#1c1c1c" }
tab_inactive = { fg = "#a89984", bg = "#3c3836" }
tab_width = 1

# Count
count_copied = { fg = "#1c1c1c", bg = "#8ec07c" }
count_cut = { fg = "#1c1c1c", bg = "#fb5944" }
count_selected = { fg = "#1c1c1c", bg = "#83a598" }

# Border
border_symbol = "│"
border_style = { fg = "#504945" }

[mode]
normal_main = { fg = "#1c1c1c", bg = "#83a598", bold = true }
normal_alt = { fg = "#83a598", bg = "#504945" }

select_main = { fg = "#1c1c1c", bg = "#d3869b", bold = true }
select_alt = { fg = "#d3869b", bg = "#504945" }

unset_main = { fg = "#1c1c1c", bg = "#fe8019", bold = true }
unset_alt = { fg = "#fe8019", bg = "#504945" }

[status]
separator_open = ""
separator_close = ""
# separator_style = { fg = "#504945", bg = "#504945" }

# Progress
progress_label = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#1c1c1c" }
progress_error = { fg = "#fb5944" }

# Permissions
perm_type = { fg = "#83a598" }
perm_read = { fg = "#fabd2f" }
perm_write = { fg = "#fb5944" }
perm_exec = { fg = "#b8bb26" }
perm_sep = { fg = "#504945" }

[pick]
border = { fg = "#504945" }
active = { fg = "#ebdbb2", bg = "#504945" }
inactive = { fg = "#ebdbb2" }

# Input
[input]
border = { fg = "#8ec07c" }
title = { fg = "#8ec07c" }
value = { fg = "#d3869b" }
selected = { bg = "#504945" }

# Completion
[completion]
border = { fg = "#8ec07c" }
active = { fg = "#ebdbb2", bg = "#504945" }
inactive = { fg = "#ebdbb2" }

icon_file = ""
icon_folder = ""
icon_command = ""

# Tasks
[tasks]
border = { fg = "#8ec07c" }
title = { fg = "#8ec07c" }
hovered = { fg = "#ebdbb2", bg = "#504945" }

# Which
[which]
cols = 3
mask = { bg = "#121212" }
cand = { fg = "#8ec07c" }
rest = { fg = "#83a598" }
desc = { fg = "#d3869b" }
separator = " ➜ "
separator_style = { fg = "#504945" }

# Confirm
[confirm]
border = { fg = "#8ec07c" }
title = { fg = "#8ec07c" }
content = {}
list = {}
btn_yes = { bg = "#504945" }
btn_no = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]

# Spot
[spot]
border = { fg = "#8ec07c" }
title = { fg = "#8ec07c" }

# Notify
[notify]
title_info = { fg = "#83a598" }
title_warn = { fg = "#fabd2f" }
title_error = { fg = "#fb5944" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on = { fg = "#b8bb26" }
run = { fg = "#d3869b" }
hovered = { bg = "#303030" }
footer = { fg = "#ebdbb2", bg = "#121212" }

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#fe8019" },

  # Media
  { mime = "{audio,video}/*", fg = "#d3869b" },

  # Archives
  { mime = "application/*zip", fg = "#fb5944" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#fb5944" },

  # Documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#83a598" },

  # Empty files
  # { mime = "inode/x-empty", fg = "#fb5944" },
]
